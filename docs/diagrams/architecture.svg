<svg xmlns='http://www.w3.org/2000/svg' width='1900' height='1080' viewBox='0 0 1900 1080' font-family='Segoe UI, Arial, sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#334'/></marker></defs><rect width='100%' height='100%' fill='#fff'/><text x='950.0' y='48' font-size='26' text-anchor='middle'>IronPulse — System Architecture</text><rect x='40' y='110' width='330' height='430' rx='8' fill='#f8fafc' stroke='#334' stroke-width='1.5'/><path d='M 40 144 V 118 Q 40 110 48 110 H 362 Q 370 110 370 118 V 144 Z' fill='#475569'/><text x='54' y='133' font-size='16' font-weight='bold' fill='#fff'>Client — web browser</text><text x='54' y='166' font-size='13' xml:space='preserve'>Admin  ·  Trainer  ·  Member</text><text x='54' y='185' font-size='13' xml:space='preserve'></text><text x='54' y='204' font-size='13' xml:space='preserve'>Server-rendered HTML pages</text><text x='54' y='223' font-size='13' xml:space='preserve'>(forms, tables, search, filters,</text><text x='54' y='242' font-size='13' xml:space='preserve'>dashboards, SVG charts)</text><text x='54' y='261' font-size='13' xml:space='preserve'></text><text x='54' y='280' font-size='13' xml:space='preserve'>Small client components only for</text><text x='54' y='299' font-size='13' xml:space='preserve'>form state (useActionState) and</text><text x='54' y='318' font-size='13' xml:space='preserve'>nav highlighting</text><text x='54' y='337' font-size='13' xml:space='preserve'></text><text x='54' y='356' font-size='13' xml:space='preserve'>Cookie gym_session</text><text x='54' y='375' font-size='13' xml:space='preserve'>  JWT HS256, 8 h, httpOnly,</text><text x='54' y='394' font-size='13' xml:space='preserve'>  sameSite=lax (JS cannot read it)</text><rect x='450' y='80' width='820' height='900' rx='12' fill='#f0fdfa' stroke='#0f766e' stroke-width='2' stroke-dasharray='0'/><text x='470' y='110' font-size='18' font-weight='bold' fill='#0f766e'>Next.js 16 server (Node.js 24) — App Router, JavaScript</text><rect x='480' y='130' width='760' height='110' rx='8' fill='#fff' stroke='#0f766e' stroke-width='1.5'/><text x='494' y='154' font-size='16' font-weight='bold'>src/proxy.js — runs before every protected page</text><text x='494' y='176' font-size='13' xml:space='preserve'>Reads gym_session → decryptSession() (jose). No session → /login.</text><text x='494' y='195' font-size='13' xml:space='preserve'>Wrong role for /admin, /trainer, /member → redirect to own home page.</text><rect x='480' y='270' width='370' height='330' rx='8' fill='#fff' stroke='#0f766e' stroke-width='1.5'/><text x='494' y='294' font-size='16' font-weight='bold'>Pages (React Server Components)</text><text x='494' y='316.0' font-size='12.5' font-family='Consolas, monospace' xml:space='preserve'>/            landing</text><text x='494' y='334.5' font-size='12.5' font-family='Consolas, monospace' xml:space='preserve'>/login  /register</text><text x='494' y='353.0' font-size='12.5' font-family='Consolas, monospace' xml:space='preserve'>/admin       dashboard, check-in,</text><text x='494' y='371.5' font-size='12.5' font-family='Consolas, monospace' xml:space='preserve'>             members, classes,</text><text x='494' y='390.0' font-size='12.5' font-family='Consolas, monospace' xml:space='preserve'>             payments, plans,</text><text x='494' y='408.5' font-size='12.5' font-family='Consolas, monospace' xml:space='preserve'>             reports, setup</text><text x='494' y='427.0' font-size='12.5' font-family='Consolas, monospace' xml:space='preserve'>/trainer     home, members</text><text x='494' y='445.5' font-size='12.5' font-family='Consolas, monospace' xml:space='preserve'>/member      home, classes, training,</text><text x='494' y='464.0' font-size='12.5' font-family='Consolas, monospace' xml:space='preserve'>             workouts, exercises,</text><text x='494' y='482.5' font-size='12.5' font-family='Consolas, monospace' xml:space='preserve'>             membership, profile</text><rect x='870' y='270' width='370' height='330' rx='8' fill='#fff' stroke='#0f766e' stroke-width='1.5'/><text x='884' y='294' font-size='16' font-weight='bold'>Server Actions (form submits)</text><text x='884' y='316.0' font-size='12.5' xml:space='preserve'>actions/auth.js  login, register, logout</text><text x='884' y='334.5' font-size='12.5' xml:space='preserve'>admin/actions.js  members, payments,</text><text x='884' y='353.0' font-size='12.5' xml:space='preserve'>   refunds, classes, plans, setup</text><text x='884' y='371.5' font-size='12.5' xml:space='preserve'>trainer/actions.js  PT, attendance,</text><text x='884' y='390.0' font-size='12.5' xml:space='preserve'>   plan builder</text><text x='884' y='408.5' font-size='12.5' xml:space='preserve'>member/actions.js  book/cancel, buy,</text><text x='884' y='427.0' font-size='12.5' xml:space='preserve'>   freeze, PT request, workouts,</text><text x='884' y='445.5' font-size='12.5' xml:space='preserve'>   own plans, profile, password</text><text x='884' y='464.0' font-size='12.5' xml:space='preserve'></text><text x='884' y='482.5' font-size='12.5' xml:space='preserve'>Every action starts with</text><text x='884' y='501.0' font-size='12.5' xml:space='preserve'>requireRole(&#x27;...&#x27;) and re-checks input</text><rect x='480' y='630' width='760' height='160' rx='8' fill='#fff' stroke='#0f766e' stroke-width='1.5'/><text x='494' y='654' font-size='16' font-weight='bold'>src/lib — data-access layer (server-only)</text><text x='494' y='676.0' font-size='12.5' font-family='Consolas, monospace' xml:space='preserve'>auth.js     requireRole(), getUser()   ·   bcryptjs password hashing</text><text x='494' y='694.5' font-size='12.5' font-family='Consolas, monospace' xml:space='preserve'>session.js  encrypt/decrypt JWT with SESSION_SECRET (jose)</text><text x='494' y='713.0' font-size='12.5' font-family='Consolas, monospace' xml:space='preserve'>db.js       mysql2 pool → sql(), sqlOne(), callProcedure(), transaction()  (prepared)</text><text x='494' y='731.5' font-size='12.5' font-family='Consolas, monospace' xml:space='preserve'>mongo.js    MongoClient singleton → mongo(), toObjectId()</text><text x='494' y='750.0' font-size='12.5' font-family='Consolas, monospace' xml:space='preserve'>notifications.js · workout.js   helpers that write/read MongoDB documents</text><rect x='480' y='820' width='360' height='140' rx='8' fill='#fffbeb' stroke='#b45309' stroke-width='1.5'/><text x='494' y='844' font-size='16' font-weight='bold'>.env.local (not in Git)</text><text x='494' y='866.0' font-size='12.5' font-family='Consolas, monospace' xml:space='preserve'>MYSQL_HOST/PORT/DATABASE</text><text x='494' y='884.5' font-size='12.5' font-family='Consolas, monospace' xml:space='preserve'>MYSQL_USER / MYSQL_PASSWORD  (gym_app)</text><text x='494' y='903.0' font-size='12.5' font-family='Consolas, monospace' xml:space='preserve'>MONGODB_URI / MONGODB_DB</text><text x='494' y='921.5' font-size='12.5' font-family='Consolas, monospace' xml:space='preserve'>SESSION_SECRET</text><rect x='870' y='820' width='370' height='140' rx='8' fill='#fff' stroke='#64748b' stroke-width='1.5'/><text x='884' y='844' font-size='16' font-weight='bold'>scripts/ (run once, npm run db:setup)</text><text x='884' y='866.0' font-size='12.5' xml:space='preserve'>db-setup.mjs   connects as MySQL root</text><text x='884' y='884.5' font-size='12.5' xml:space='preserve'>  (MYSQL_ADMIN_USER) → runs db/mysql/*.sql,</text><text x='884' y='903.0' font-size='12.5' xml:space='preserve'>  creates gym_app, db/mongo collections</text><text x='884' y='921.5' font-size='12.5' xml:space='preserve'>seed-data.mjs  demo members, classes, logs</text><rect x='1420' y='110' width='450' height='470' rx='8' fill='#fff' stroke='#334' stroke-width='1.5'/><path d='M 1420 144 V 118 Q 1420 110 1428 110 H 1862 Q 1870 110 1870 118 V 144 Z' fill='#0e7490'/><text x='1434' y='133' font-size='16' font-weight='bold' fill='#fff'>MySQL 8 — gym_db (relational, ACID)</text><text x='1434' y='166' font-size='13' xml:space='preserve'>13 tables, 16 foreign keys, 22 CHECK constraints</text><text x='1434' y='185' font-size='13' xml:space='preserve'>7 views (v_member_overview, v_class_schedule, …)</text><text x='1434' y='204' font-size='13' xml:space='preserve'>4 stored functions, 13 stored procedures</text><text x='1434' y='223' font-size='13' xml:space='preserve'>  (transactions + SIGNAL 45000 business errors)</text><text x='1434' y='242' font-size='13' xml:space='preserve'>18 triggers (validation, audit_log, cascades)</text><text x='1434' y='261' font-size='13' xml:space='preserve'>2 scheduled events (expire memberships,</text><text x='1434' y='280' font-size='13' xml:space='preserve'>  close classes, no-shows, auto check-out)</text><text x='1434' y='299' font-size='13' xml:space='preserve'>FULLTEXT indexes on trainers, class_types</text><text x='1434' y='318' font-size='13' xml:space='preserve'></text><text x='1434' y='337' font-size='13' xml:space='preserve'>Holds: users &amp; roles, members, trainers,</text><text x='1434' y='356' font-size='13' xml:space='preserve'>plans, memberships, payments, classes,</text><text x='1434' y='375' font-size='13' xml:space='preserve'>bookings, PT sessions, attendance, audit</text><text x='1434' y='394' font-size='13' xml:space='preserve'></text><text x='1434' y='413' font-size='13' xml:space='preserve'>App connects as gym_app:</text><text x='1434' y='432' font-size='13' xml:space='preserve'>  SELECT, INSERT, UPDATE, DELETE, EXECUTE only</text><text x='1434' y='451' font-size='13' xml:space='preserve'>  (no DROP / ALTER / CREATE)</text><rect x='1420' y='620' width='450' height='340' rx='8' fill='#fff' stroke='#334' stroke-width='1.5'/><path d='M 1420 654 V 628 Q 1420 620 1428 620 H 1862 Q 1870 620 1870 628 V 654 Z' fill='#3f6212'/><text x='1434' y='643' font-size='16' font-weight='bold' fill='#fff'>MongoDB 8 — gym_mongo (documents)</text><text x='1434' y='676' font-size='12' font-family='Consolas, monospace' xml:space='preserve'>exercises        library + member-private ones,</text><text x='1434' y='694' font-size='12' font-family='Consolas, monospace' xml:space='preserve'>                 weighted $text search</text><text x='1434' y='712' font-size='12' font-family='Consolas, monospace' xml:space='preserve'>workout_plans    nested days → exercises</text><text x='1434' y='730' font-size='12' font-family='Consolas, monospace' xml:space='preserve'>workout_logs     sets / cardio arrays; aggregation</text><text x='1434' y='748' font-size='12' font-family='Consolas, monospace' xml:space='preserve'>                 pipelines for volume, PRs, streaks</text><text x='1434' y='766' font-size='12' font-family='Consolas, monospace' xml:space='preserve'>body_metrics     time-series collection</text><text x='1434' y='784' font-size='12' font-family='Consolas, monospace' xml:space='preserve'>notifications    inbox, TTL index (60 days)</text><text x='1434' y='802' font-size='12' font-family='Consolas, monospace' xml:space='preserve'></text><text x='1434' y='820' font-size='12' font-family='Consolas, monospace' xml:space='preserve'>$jsonSchema validators; links to MySQL by</text><text x='1434' y='838' font-size='12' font-family='Consolas, monospace' xml:space='preserve'>memberId / trainerId / userId (checked in MySQL first)</text><path d='M 370 300 L 480 300' fill='none' stroke='#334' stroke-width='1.8' marker-end='url(#a)'/><text x='410' y='268' font-size='12.5' text-anchor='middle' fill='#222'>GET page /</text><text x='410' y='285' font-size='12.5' text-anchor='middle' fill='#222'>POST form</text><path d='M 480 340 L 370 340' fill='none' stroke='#334' stroke-width='1.8' marker-end='url(#a)'/><text x='410' y='360' font-size='12.5' text-anchor='middle' fill='#222'>HTML (RSC)</text><path d='M 665 600 L 665 630' fill='none' stroke='#334' stroke-width='1.8' marker-end='url(#a)'/><path d='M 1055 600 L 1055 630' fill='none' stroke='#334' stroke-width='1.8' marker-end='url(#a)'/><path d='M 1240 680 L 1300 680 L 1300 400 L 1420 400' fill='none' stroke='#334' stroke-width='1.8' marker-end='url(#a)'/><text x='1308' y='470' font-size='12.5' text-anchor='start' fill='#222'>mysql2 pool,</text><text x='1308' y='487' font-size='12.5' text-anchor='start' fill='#222'>prepared</text><text x='1308' y='504' font-size='12.5' text-anchor='start' fill='#222'>statements</text><path d='M 1240 760 L 1420 760' fill='none' stroke='#334' stroke-width='1.8' marker-end='url(#a)'/><text x='1340' y='750' font-size='12.5' text-anchor='middle' fill='#222'>MongoDB driver</text><path d='M 660 820 L 660 790' fill='none' stroke='#b45309' stroke-width='1.8' stroke-dasharray='7 5' marker-end='url(#a)'/><path d='M 1240 900 L 1395 900 L 1395 560 L 1420 560' fill='none' stroke='#64748b' stroke-width='1.8' stroke-dasharray='7 5' marker-end='url(#a)'/><path d='M 1395 900 L 1420 900' fill='none' stroke='#64748b' stroke-width='1.8' stroke-dasharray='7 5' marker-end='url(#a)'/><text x='1278' y='925' font-size='12.5'>as root: DDL, routines,</text><text x='1278' y='942' font-size='12.5'>triggers, events, seed</text><text x='40' y='600' font-size='14' font-weight='bold'>How one request flows</text><text x='40' y='628' font-size='13'>1. Browser sends request + cookie.</text><text x='40' y='649' font-size='13'>2. proxy.js checks the JWT role.</text><text x='40' y='670' font-size='13'>3. Page / action calls requireRole().</text><text x='40' y='691' font-size='13'>4. lib/db.js runs a view, query or</text><text x='40' y='712' font-size='13'>   CALL sp_…(…) on MySQL; triggers</text><text x='40' y='733' font-size='13'>   and CHECKs validate in the DB.</text><text x='40' y='754' font-size='13'>5. lib/mongo.js reads/writes</text><text x='40' y='775' font-size='13'>   documents (plans, logs, inbox).</text><text x='40' y='796' font-size='13'>6. HTML is rendered on the server</text><text x='40' y='817' font-size='13'>   and sent back; DB errors</text><text x='40' y='838' font-size='13'>   (SIGNAL) are shown in the form.</text><line x1='40' x2='90' y1='890' y2='890' stroke='#64748b' stroke-width='1.8' stroke-dasharray='7 5'/><text x='100' y='894' font-size='12.5'>setup-time only</text></svg>