='preserve'>readAt</text><text x='1020' y='603.5' font-size='11' fill='#555' text-anchor='end'>date | null</text><text x='570' y='624.5' font-size='11.5' fill='#3f6212' font-weight='bold'></text><text x='610' y='624.5' font-size='12.5'  xml:space='preserve'>createdAt</text><text x='1020' y='624.5' font-size='11' fill='#555' text-anchor='end'>date  (TTL 60 days)</text><rect x='561' y='631.0' width='468' height='21' fill='#f4f7ef'/><text x='570' y='645.5' font-size='11.5' fill='#3f6212' font-weight='bold'>EMB</text><text x='610' y='645.5' font-size='12.5'  xml:space='preserve'>meta</text><text x='1020' y='645.5' font-size='11' fill='#555' text-anchor='end'>object</text><line x1='560' x2='1030' y1='658' y2='658' stroke='#bbb'/><text x='570' y='674' font-size='11.5' font-weight='bold'>Indexes</text><text x='570' y='692' font-size='11'>user_inbox: {userId:1, readAt:1, createdAt:-1}</text><text x='570' y='710' font-size='11'>ttl_60_days: {createdAt:1} TTL 60d</text><text x='40' y='756' font-size='12.5'>REF = reference by value (no join): memberId / trainerId / userId / createdBy hold MySQL primary keys; the app checks them in MySQL before writing to MongoDB.</text><text x='40' y='776' font-size='12.5'>EMB = embedded sub-document / array: a plan&#x27;s days and exercises, and a log&#x27;s sets, are always read together, so they are stored inside the parent document.</text><text x='40' y='796' font-size='12.5'>Arrows show ObjectId references inside MongoDB (exerciseId → exercises._id, planId → workout_plans._id).</text><text x='40' y='816' font-size='12.5'>exercises, workout_plans, workout_logs and notifications have a $jsonSchema validator (strict, action error). body_metrics is a time-series collection (range 25–300 kg checked by the app); notifications expire after 60 days (TTL index).</text></svg>